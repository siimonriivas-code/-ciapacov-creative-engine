name: Validate Creative Ecosystem v0.8

on:
  push:
    branches: [main]
    paths:
      - 'validation/run-v08.txt'
      - '.github/workflows/validate-v08.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate complete ecosystem
        run: npm run validate:all
      - name: Validate media tooling syntax
        run: |
          node --check scripts/ingest-media.mjs
          node --check scripts/build-production-compact.mjs
      - name: Regenerate compact catalogs
        run: npm run catalog:all
      - name: TypeScript and Vite build
        run: npm run build
      - name: Remotion composition check
        run: |
          npx remotion compositions src/remotion/index.ts | tee /tmp/remotion-v08.txt
          COUNT=$(grep -oE 'CE-[A-Za-z-]+' /tmp/remotion-v08.txt | sort -u | wc -l)
          echo "Detected Remotion compositions: $COUNT"
          test "$COUNT" -eq 9
      - name: Render smoke frames for all production compositions
        run: |
          mkdir -p /tmp/remotion-smoke
          for ID in CE-RouteJourney CE-DataCascade CE-ProcessConnected CE-LaunchEditorial CE-DocumentaryEvidence CE-BeforeAfter CE-TimelineTerritory CE-TestimonialQuote CE-NoticeAlert; do
            echo "Rendering $ID"
            npx remotion still src/remotion/index.ts "$ID" "/tmp/remotion-smoke/$ID.png" --frame=30
            test -s "/tmp/remotion-smoke/$ID.png"
          done
          echo "Rendered smoke frames: $(find /tmp/remotion-smoke -name '*.png' | wc -l)"
      - name: Production registry summary
        run: |
          node -e "const p=require('./src/registry/production-masters.json');const r=require('./src/registry/media-roles.json');const m=require('./src/registry/media-library.json');console.log('production masters:',p.length,'media roles:',r.length,'verified media:',m.length)"
