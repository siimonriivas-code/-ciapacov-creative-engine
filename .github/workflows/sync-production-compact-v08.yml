name: Sync v0.8 production compact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-production-compact-v08.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run production:build
      - run: |
          git config user.name 'ciapacov-creative-engine-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add claude/production.compact.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Sync v0.8 production compact catalog'
          git pull --rebase origin main
          git push origin main
