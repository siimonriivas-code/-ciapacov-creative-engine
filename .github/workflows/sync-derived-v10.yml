name: Sync v1.0 derived files

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-derived-v10.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --no-audit --no-fund
      - run: npm run handoff:build
      - run: |
          git config user.name 'ciapacov-creative-engine-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add package-lock.json claude/handoff.compact.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Sync v1.0 lockfile and handoff compact catalog'
          git pull --rebase origin main
          git push origin main
