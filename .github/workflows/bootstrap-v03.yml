name: Bootstrap Creative Engine v0.3

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/v03-delta.b64'
      - '.github/workflows/bootstrap-v03.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.3 payload
        shell: bash
        run: |
          set -euo pipefail
          base64 -d bootstrap/v03-delta.b64 > /tmp/ce-v03.tar.gz
          tar -xzf /tmp/ce-v03.tar.gz -C .
          node scripts/validate-registry.mjs
          node scripts/build-compact-catalog.mjs
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-v03.yml

      - name: Commit v0.3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ciapacov-creative-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Build CIAPACOV Creative Engine v0.3"
          git push origin main
