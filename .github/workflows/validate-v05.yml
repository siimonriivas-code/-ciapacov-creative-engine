name: Validate Creative Ecosystem v0.5

on:
  push:
    branches: [main]
    paths:
      - 'validation/run-v05.txt'
      - '.github/workflows/validate-v05.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore exact templates registry if missing
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f src/registry/templates.json ] && [ -f validation/templates-json.gz.b64 ]; then
            mkdir -p src/registry
            base64 -d validation/templates-json.gz.b64 | gzip -dc > src/registry/templates.json
            node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('src/registry/templates.json','utf8')); if(x.length!==80) throw new Error('Expected 80 templates, got '+x.length); console.log('Restored '+x.length+' templates');"
          else
            echo 'templates.json already present or repair payload unavailable'
          fi

      - name: Install dependencies
        id: install
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee /tmp/install.txt

      - name: Registry validation
        id: registries
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run validate:all 2>&1 | tee /tmp/registries.txt

      - name: TypeScript and Vite build
        id: build
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.txt

      - name: Remotion composition check
        id: remotion
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx remotion compositions src/remotion/index.ts 2>&1 | tee /tmp/remotion.txt

      - name: Write validation report
        if: always()
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          REGISTRY_OUTCOME: ${{ steps.registries.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          REMOTION_OUTCOME: ${{ steps.remotion.outcome }}
        run: |
          mkdir -p validation/logs
          cp /tmp/install.txt validation/logs/install.txt 2>/dev/null || true
          cp /tmp/registries.txt validation/logs/registries.txt 2>/dev/null || true
          cp /tmp/build.txt validation/logs/build.txt 2>/dev/null || true
          cp /tmp/remotion.txt validation/logs/remotion.txt 2>/dev/null || true
          {
            echo '# CIAPACOV Creative Ecosystem v0.5 — Build Validation'
            echo
            echo 'Validation executed automatically on GitHub-hosted Ubuntu with Node 22.'
            echo
            echo '| Check | Outcome |'
            echo '|---|---|'
            echo "| npm install | ${INSTALL_OUTCOME} |"
            echo "| registry/ecosystem validators | ${REGISTRY_OUTCOME} |"
            echo "| TypeScript + Vite build | ${BUILD_OUTCOME} |"
            echo "| Remotion compositions | ${REMOTION_OUTCOME} |"
            echo
            echo "Source commit triggering this run: ${GITHUB_SHA}"
            echo
            echo 'Detailed logs are stored in `validation/logs/`.'
          } > validation/BUILD_STATUS.md

      - name: Commit repair and report
        if: always()
        shell: bash
        run: |
          git config user.name 'ciapacov-creative-engine-bot'
          git config user.email 'actions@users.noreply.github.com'
          if [ -f src/registry/templates.json ]; then git add src/registry/templates.json; fi
          git add validation/BUILD_STATUS.md validation/logs/*.txt
          if [ -f validation/templates-json.gz.b64 ]; then git rm validation/templates-json.gz.b64; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair and validate CIAPACOV Creative Ecosystem v0.5'
          git push origin main
