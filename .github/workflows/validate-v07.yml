name: Validate Creative Ecosystem v0.7

on:
  push:
    branches: [main]
    paths:
      - 'validation/run-v07.txt'
      - '.github/workflows/validate-v07.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install --no-audit --no-fund
      - name: Validate registries, ecosystem and visual library
        id: validators
        if: always()
        continue-on-error: true
        run: npm run validate:all
      - name: Regenerate compact and offline catalogs
        id: catalogs
        if: always()
        continue-on-error: true
        run: npm run catalog:all
      - name: TypeScript and Vite build
        id: build
        if: always()
        continue-on-error: true
        run: npm run build
      - name: Remotion composition check
        id: remotion
        if: always()
        continue-on-error: true
        run: npx remotion compositions src/remotion/index.ts
      - name: Publish validation summary
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VALIDATOR_OUTCOME: ${{ steps.validators.outcome }}
          CATALOG_OUTCOME: ${{ steps.catalogs.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          REMOTION_OUTCOME: ${{ steps.remotion.outcome }}
        run: |
          {
            echo '# CIAPACOV Creative Ecosystem v0.7 — Validation'
            echo
            echo '| Check | Outcome |'
            echo '|---|---|'
            echo "| npm install | ${INSTALL_OUTCOME} |"
            echo "| registry/ecosystem/visual validators | ${VALIDATOR_OUTCOME} |"
            echo "| compact + offline catalogs | ${CATALOG_OUTCOME} |"
            echo "| TypeScript + Vite build | ${BUILD_OUTCOME} |"
            echo "| Remotion compositions | ${REMOTION_OUTCOME} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Assert all checks passed
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VALIDATOR_OUTCOME: ${{ steps.validators.outcome }}
          CATALOG_OUTCOME: ${{ steps.catalogs.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          REMOTION_OUTCOME: ${{ steps.remotion.outcome }}
        run: |
          test "$INSTALL_OUTCOME" = success
          test "$VALIDATOR_OUTCOME" = success
          test "$CATALOG_OUTCOME" = success
          test "$BUILD_OUTCOME" = success
          test "$REMOTION_OUTCOME" = success
