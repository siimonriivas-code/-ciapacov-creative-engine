name: Bootstrap Creative Engine v0.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-v02.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand Creative Engine payload
        shell: bash
        run: |
          set -euo pipefail
          base64 -d bootstrap/payload.b64 > /tmp/ciapacov-engine-v02.tar.gz
          tar -xzf /tmp/ciapacov-engine-v02.tar.gz -C .
          rm -rf bootstrap

      - name: Commit v0.2 structure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ciapacov-creative-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Build CIAPACOV Creative Engine v0.2"
          git push origin main
