name: Validate Creative Ecosystem v1.1

on:
  push:
    branches: [main]
    paths:
      - 'validation/**'
      - '.github/workflows/validate-v11.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'src/App.tsx'
      - 'src/components/**'
      - 'src/lib/**'
      - 'src/motion/**'
      - 'src/registry/**'
      - 'src/remotion/**'
      - 'src/styles.v11.css'
      - 'src/styles.v11.curated.css'
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate registries and ecosystem contracts
        run: npm run validate:all

      - name: Validate premium tooling syntax
        run: |
          node --check scripts/audit-creative-benchmark.mjs
          node --check scripts/build-generative-shot-plan.mjs
          node --check scripts/generate-minimax-video.mjs
          node --check scripts/audit-premium-production.mjs

      - name: Validate production build
        run: npm run build

      - name: Validate factual Agua Bienestar fixture
        run: npm run qa:real

      - name: Validate premium inventory
        run: |
          node - <<'NODE'
          const styles=require('./src/registry/creative-style-families.json')
          const directions=require('./src/registry/premium-style-presets.json')
          const motion=require('./src/registry/premium-motion-modules.json')
          const implementations=require('./src/registry/premium-motion-implementations.json')
          const materials=require('./src/registry/premium-material-systems.json')
          const kits=require('./src/registry/premium-template-kits.json')
          const lotties=require('./src/registry/first-party-lottie-presets.json')
          const shots=require('./src/registry/generative-shot-archetypes.json')
          const benchmark=require('./src/registry/creative-benchmark-gates.json')
          const dna=require('./src/registry/reference-analysis-dimensions.json')
          const dirCount=directions.reduce((n,x)=>n+x.directions.length,0)
          if(styles.length!==12||dirCount!==36||motion.length!==39||implementations.length!==39||materials.length!==18||kits.length!==27||lotties.length!==18||shots.shots.length!==18||benchmark.passScore!==82||dna.dimensions.length!==12)process.exit(1)
          const masters=new Map()
          for(const kit of kits)masters.set(kit.productionMasterId,(masters.get(kit.productionMasterId)||0)+1)
          if(masters.size!==9||[...masters.values()].some(v=>v!==3))process.exit(1)
          console.log({styles:styles.length,directions:dirCount,motion:motion.length,implementations:implementations.length,materials:materials.length,kits:kits.length,lotties:lotties.length,generativeShots:shots.shots.length,referenceDnaDimensions:dna.dimensions.length,benchmarkPassScore:benchmark.passScore,masters:[...masters.entries()]})
          NODE

      - name: Anti-generic and factual safety gates
        run: |
          node scripts/audit-premium-production.mjs validation/premium-plan-pass.json
          node scripts/audit-premium-production.mjs validation/agua-route-premium-v11.json
          if node scripts/audit-premium-production.mjs validation/premium-plan-fail.json; then
            echo 'ERROR: intentionally generic/factual-unsafe fixture passed'
            exit 1
          fi

      - name: Premium creative benchmark positive fixture
        run: node scripts/audit-creative-benchmark.mjs validation/creative-benchmark-pass.json

      - name: Premium creative benchmark negative fixture must fail
        run: |
          if node scripts/audit-creative-benchmark.mjs validation/creative-benchmark-fail.json; then
            echo 'ERROR: deliberately weak/factual-unsafe creative benchmark fixture passed unexpectedly'
            exit 1
          else
            echo 'Expected creative benchmark failure confirmed'
          fi

      - name: Build governed generative shot plan
        run: |
          node scripts/build-generative-shot-plan.mjs GENSHOT-WATER-RIBBON /tmp/genshot.json --mode=text-to-video --duration=6 --resolution=1080P
          node -e "const p=require('/tmp/genshot.json');if(p.archetypeId!=='GENSHOT-WATER-RIBBON'||p.semanticClass!=='SCENE-CONCEPTUAL'||p.deterministicOverlayContract.facts!==true)process.exit(1);console.log('generative shot plan ok')"

      - name: Discover base and premium Remotion compositions
        run: |
          npx remotion compositions src/remotion/index.ts | tee /tmp/remotion-v11.txt
          TOTAL=$(grep -oE 'CE-[A-Za-z0-9-]+' /tmp/remotion-v11.txt | sort -u | wc -l)
          KIT_TOTAL=$(grep -oE 'CE-KIT-[A-Za-z0-9-]+' /tmp/remotion-v11.txt | sort -u | wc -l)
          echo "Total compositions: $TOTAL · premium kits: $KIT_TOTAL"
          test "$TOTAL" -eq 37
          test "$KIT_TOTAL" -eq 27
          for ID in CE-RouteJourney CE-DataCascade CE-ProcessConnected CE-LaunchEditorial CE-DocumentaryEvidence CE-BeforeAfter CE-TimelineTerritory CE-TestimonialQuote CE-NoticeAlert CE-QA-LottieRuntime; do
            grep -q "$ID" /tmp/remotion-v11.txt
          done

      - name: Smoke render nine Production Masters
        run: |
          mkdir -p /tmp/remotion-v11/base
          for ID in CE-RouteJourney CE-DataCascade CE-ProcessConnected CE-LaunchEditorial CE-DocumentaryEvidence CE-BeforeAfter CE-TimelineTerritory CE-TestimonialQuote CE-NoticeAlert; do
            npx remotion still src/remotion/index.ts "$ID" "/tmp/remotion-v11/base/$ID.png" --frame=30
            test -s "/tmp/remotion-v11/base/$ID.png"
          done
          test "$(find /tmp/remotion-v11/base -name '*.png' | wc -l)" -eq 9

      - name: Smoke render all 27 premium template kits
        run: |
          mkdir -p /tmp/remotion-v11/kits
          IDS=$(grep -oE 'CE-KIT-[A-Za-z0-9-]+' /tmp/remotion-v11.txt | sort -u)
          for ID in $IDS; do
            npx remotion still src/remotion/index.ts "$ID" "/tmp/remotion-v11/kits/$ID.png" --frame=60
            test -s "/tmp/remotion-v11/kits/$ID.png"
          done
          test "$(find /tmp/remotion-v11/kits -name '*.png' | wc -l)" -eq 27

      - name: Validate Lottie runtime at multiple frames
        run: |
          for FRAME in 0 45 89; do
            npx remotion still src/remotion/index.ts CE-QA-LottieRuntime "/tmp/remotion-v11/lottie-$FRAME.png" --frame=$FRAME
            test -s "/tmp/remotion-v11/lottie-$FRAME.png"
          done
          node -e "import('@remotion/lottie').then(()=>console.log('@remotion/lottie ok'))"
          node -e "import('lottie-web').then(()=>console.log('lottie-web ok'))"

      - name: Validate MiniMax governed executor in dry-run mode
        run: |
          cat > /tmp/minimax-concept.json <<'JSON'
          {
            "id":"QA-CONCEPT-001",
            "semanticClass":"SCENE-CONCEPTUAL",
            "purpose":"Abstract water transition",
            "prompt":"Abstract translucent water ribbon crossing a neutral editorial field, elegant controlled motion, no text, no logos, no real location.",
            "mode":"text-to-video",
            "model":"MiniMax-Hailuo-2.3",
            "durationSeconds":6,
            "resolution":"1080P",
            "cameraCommands":["Static shot"]
          }
          JSON
          node scripts/generate-minimax-video.mjs /tmp/minimax-concept.json | tee /tmp/minimax-dry-run.txt
          grep -q 'DRY RUN ONLY' /tmp/minimax-dry-run.txt

      - name: v1.1 premium release summary
        run: |
          echo 'Creative Ecosystem v1.1 validated'
          echo '12 style families · 36 directions · 39 executable motion modules · 18 material systems · 18 first-party Lotties · 27 executable premium template kits · 18 governed generative shot archetypes · 12 reference-DNA dimensions · creative benchmark >=82 · 9 Production Masters'
