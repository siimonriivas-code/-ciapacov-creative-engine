name: Validate Creative Ecosystem v1.1

on:
  push:
    branches: [main]
    paths:
      - 'validation/run-v11.txt'
      - 'validation/premium-plan-pass.json'
      - 'validation/premium-plan-fail.json'
      - '.github/workflows/validate-v11.yml'
      - 'package.json'
      - 'scripts/validate-v11.mjs'
      - 'scripts/generate-minimax-video.mjs'
      - 'scripts/audit-premium-production.mjs'
      - 'src/App.tsx'
      - 'src/styles.v11.css'
      - 'src/components/PremiumVisualLab.tsx'
      - 'src/registry/creative-style-families.json'
      - 'src/registry/premium-motion-modules.json'
      - 'src/registry/premium-motion-implementations.json'
      - 'src/registry/generative-video-providers.json'
      - 'src/registry/generative-scene-policies.json'
      - 'src/lib/creative-style-director.ts'
      - 'src/lib/generative-video.ts'
      - 'src/motion/**'
      - 'src/remotion/**'
      - 'claude/premium.compact.json'
      - 'claude/handoff.compact.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync v1.1 lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate full ecosystem including premium layer
        run: npm run validate:all

      - name: Validate v1.1 tooling syntax
        run: |
          node --check scripts/validate-v11.mjs
          node --check scripts/ingest-motion-asset.mjs
          node --check scripts/generate-minimax-video.mjs
          node --check scripts/audit-premium-production.mjs

      - name: Check v1.1 compact handoff contract
        run: |
          node -e "const h=require('./claude/handoff.compact.json');if(h.version!=='1.1'||h.inventory.premiumStyleFamilies!==12||h.inventory.premiumMotionModules!==39||h.inventory.premiumMotionExecutable!==39||h.rules.antiGenericAuditBeforePremiumExport!==true||h.rules.generativeEvidenceForbidden!==true)process.exit(1);console.log(h.inventory)"
          node -e "const p=require('./claude/premium.compact.json');if(p.version!=='1.1'||p.motionLibrary.moduleCount!==39||p.motionLibrary.executableCount!==39||p.generativeVideo.providers.length<2||p.antiGeneric.passScore!==80)process.exit(1);console.log('premium handoff ok')"

      - name: Check exact premium implementation coverage
        run: |
          node -e "const m=require('./src/registry/premium-motion-modules.json');const i=require('./src/registry/premium-motion-implementations.json');const ms=new Set(m.map(x=>x.id));const is=new Set(i.map(x=>x.id));if(m.length!==39||i.length!==39||[...ms].some(x=>!is.has(x))||[...is].some(x=>!ms.has(x)))process.exit(1);console.log('39/39 premium motion modules executable')"

      - name: Premium anti-generic positive fixture
        run: node scripts/audit-premium-production.mjs validation/premium-plan-pass.json

      - name: Premium anti-generic negative fixture must fail
        run: |
          if node scripts/audit-premium-production.mjs validation/premium-plan-fail.json; then
            echo 'ERROR: deliberately generic/factual-unsafe fixture passed unexpectedly'
            exit 1
          else
            echo 'Expected failure confirmed for generic/factual-unsafe fixture'
          fi

      - name: TypeScript and Vite build
        run: npm run build

      - name: Run factual Agua Bienestar QA
        run: npm run qa:real

      - name: Discover Production Master and QA compositions
        run: |
          npx remotion compositions src/remotion/index.ts | tee /tmp/remotion-v11.txt
          TOTAL=$(grep -oE 'CE-[A-Za-z-]+' /tmp/remotion-v11.txt | sort -u | wc -l)
          echo "Detected Remotion compositions: $TOTAL"
          test "$TOTAL" -eq 10
          for ID in CE-RouteJourney CE-DataCascade CE-ProcessConnected CE-LaunchEditorial CE-DocumentaryEvidence CE-BeforeAfter CE-TimelineTerritory CE-TestimonialQuote CE-NoticeAlert CE-QA-LottieRuntime; do
            grep -q "$ID" /tmp/remotion-v11.txt
          done

      - name: Smoke render all nine Production Masters
        run: |
          mkdir -p /tmp/remotion-v11
          for ID in CE-RouteJourney CE-DataCascade CE-ProcessConnected CE-LaunchEditorial CE-DocumentaryEvidence CE-BeforeAfter CE-TimelineTerritory CE-TestimonialQuote CE-NoticeAlert; do
            npx remotion still src/remotion/index.ts "$ID" "/tmp/remotion-v11/$ID.png" --frame=30
            test -s "/tmp/remotion-v11/$ID.png"
          done
          test "$(find /tmp/remotion-v11 -name 'CE-*.png' | wc -l)" -eq 9

      - name: Render first-party Lottie through Remotion
        run: |
          for FRAME in 0 45 89; do
            npx remotion still src/remotion/index.ts CE-QA-LottieRuntime "/tmp/remotion-v11/lottie-$FRAME.png" --frame=$FRAME
            test -s "/tmp/remotion-v11/lottie-$FRAME.png"
          done

      - name: Build controlled 45s route props
        run: |
          cat > /tmp/ab-route-v11-props.json <<'JSON'
          {
            "brand": {
              "surface":"#ffffff",
              "surfaceAlt":"#f5f7f8",
              "ink":"#1D1D1B",
              "muted":"#68727a",
              "primary":"#00AAED",
              "secondary":"#B5F6FF",
              "accent":"#89033A",
              "line":"#dce5e8"
            },
            "title":"Rutas semanales",
            "kicker":"RUTAS PROGRAMADAS",
            "stops":["Benito Juárez","Palo Alto","Buenavista","Villa Flores"],
            "groups":[
              {"label":"LUNES","items":["Benito Juárez","Palo Alto","Buenavista","Villa Flores"]},
              {"label":"MARTES Y VIERNES","items":["Mirador de la Cumbre I y II","Moctezuma","Paraíso","Jardines del Sol"]},
              {"label":"MIÉRCOLES","items":["Del Valle","San Isidro","Lo de Villa"]},
              {"label":"JUEVES","items":["Tierra y Libertad","Palo Alto","Buenavista","Villa Flores"]},
              {"label":"SÁBADO","items":["Tierra y Libertad","El Moralete","De los Trabajadores","Patios del Ferrocarril","La Albarrada"]}
            ],
            "highlight":"Garrafón de 20 L · $10 a domicilio",
            "footer":"Información: 312 311 9041",
            "durationSeconds":45
          }
          JSON

      - name: Premium Route Journey multi-frame smoke test
        run: |
          for FRAME in 30 330 690 1050 1320; do
            npx remotion still src/remotion/index.ts CE-RouteJourney "/tmp/remotion-v11/route-$FRAME.png" --frame=$FRAME --props=/tmp/ab-route-v11-props.json
            test -s "/tmp/remotion-v11/route-$FRAME.png"
          done

      - name: Verify Lottie runtime packages resolve
        run: |
          node -e "import('@remotion/lottie').then(()=>console.log('@remotion/lottie ok'))"
          node -e "import('lottie-web').then(()=>console.log('lottie-web ok'))"

      - name: Validate MiniMax executor in dry-run mode
        run: |
          cat > /tmp/minimax-concept.json <<'JSON'
          {
            "id":"QA-CONCEPT-001",
            "semanticClass":"SCENE-CONCEPTUAL",
            "purpose":"Abstract water transition",
            "prompt":"Abstract translucent water ribbon crossing a neutral editorial field, elegant controlled motion, no text, no logos, no real location.",
            "mode":"text-to-video",
            "model":"MiniMax-Hailuo-2.3",
            "durationSeconds":6,
            "resolution":"1080P",
            "cameraCommands":["Static shot"]
          }
          JSON
          node scripts/generate-minimax-video.mjs /tmp/minimax-concept.json | tee /tmp/minimax-dry-run.txt
          grep -q 'DRY RUN ONLY' /tmp/minimax-dry-run.txt

      - name: Commit synchronized lockfile if changed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git fetch origin main
            git reset --hard origin/main
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            if ! git diff --quiet -- package-lock.json; then
              git add package-lock.json
              git commit -m 'chore: sync v1.1 premium dependencies lockfile'
              git push origin HEAD:main
            else
              echo 'Latest main already has synchronized package-lock.json'
            fi
          else
            echo 'package-lock.json already synchronized'
          fi

      - name: v1.1 release summary
        run: |
          node -e "const p=require('./package.json');const h=require('./claude/handoff.compact.json');const s=require('./src/registry/creative-style-families.json');const m=require('./src/registry/premium-motion-modules.json');const i=require('./src/registry/premium-motion-implementations.json');console.log('version:',p.version,'handoff:',h.version,'styles:',s.length,'premium modules:',m.length,'executable:',i.length,'production masters:',h.inventory.productionMasters,'qa compositions: 1')"
