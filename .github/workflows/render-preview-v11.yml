name: Render Premium Preview v1.1

on:
  push:
    branches: [main]
    paths:
      - 'validation/run-preview-v11.txt'
      - '.github/workflows/render-preview-v11.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Prepare Agua Bienestar 45s props
        run: |
          cat > /tmp/ab-route-preview.json <<'JSON'
          {
            "brand": {
              "surface":"#ffffff",
              "surfaceAlt":"#f5f7f8",
              "ink":"#1D1D1B",
              "muted":"#68727a",
              "primary":"#00AAED",
              "secondary":"#B5F6FF",
              "accent":"#89033A",
              "line":"#dce5e8"
            },
            "title":"Rutas semanales",
            "kicker":"RUTAS PROGRAMADAS",
            "stops":["Benito Juárez","Palo Alto","Buenavista","Villa Flores"],
            "groups":[
              {"label":"LUNES","items":["Benito Juárez","Palo Alto","Buenavista","Villa Flores"]},
              {"label":"MARTES Y VIERNES","items":["Mirador de la Cumbre I y II","Moctezuma","Paraíso","Jardines del Sol"]},
              {"label":"MIÉRCOLES","items":["Del Valle","San Isidro","Lo de Villa"]},
              {"label":"JUEVES","items":["Tierra y Libertad","Palo Alto","Buenavista","Villa Flores"]},
              {"label":"SÁBADO","items":["Tierra y Libertad","El Moralete","De los Trabajadores","Patios del Ferrocarril","La Albarrada"]}
            ],
            "highlight":"Garrafón de 20 L · $10 a domicilio",
            "footer":"Información: 312 311 9041",
            "durationSeconds":45
          }
          JSON

      - name: Render route contact frames
        run: |
          mkdir -p preview
          for FRAME in 30 180 330 510 690 870 1050 1230 1320; do
            npx remotion still src/remotion/index.ts CE-RouteJourney "preview/route-$FRAME.png" --frame=$FRAME --props=/tmp/ab-route-preview.json
          done

      - name: Render master gallery
        run: |
          for SPEC in 'CE-LaunchEditorial:180' 'CE-DataCascade:300' 'CE-ProcessConnected:450' 'CE-DocumentaryEvidence:300' 'CE-BeforeAfter:450' 'CE-TimelineTerritory:600' 'CE-TestimonialQuote:300' 'CE-NoticeAlert:240' 'CE-QA-LottieRuntime:45'; do
            ID="${SPEC%%:*}"
            FRAME="${SPEC##*:}"
            npx remotion still src/remotion/index.ts "$ID" "preview/$ID.png" --frame=$FRAME
          done

      - name: Upload premium preview stills
        uses: actions/upload-artifact@v4
        with:
          name: ciapacov-v11-premium-preview
          path: preview/*.png
          if-no-files-found: error
          retention-days: 14
