name: Bootstrap Creative Ecosystem v0.7

on:
  push:
    branches: [main]
    paths:
      - 'validation/bootstrap-v07.txt'
      - '.github/workflows/bootstrap-v07.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate v0.7 files
        run: node scripts/bootstrap-v07.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate full ecosystem
        run: npm run validate:all
      - name: Rebuild catalogs
        run: npm run catalog:all
      - name: Build React/Vite
        run: npm run build
      - name: Check Remotion compositions
        run: npx remotion compositions src/remotion/index.ts
      - name: Commit v0.7
        run: |
          git config user.name 'ciapacov-creative-engine-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Build CIAPACOV Creative Ecosystem v0.7' || exit 0
          git push origin main
